        UI.statusLeft.textContent = `OSC v${APP_VERSION}`;
        
        // Apply scanlines setting
        const cfg = S.config();
        if (cfg.scanlines === false) {
            document.body.classList.add('no-scanlines');
        }
        
        SM.restore();
        UI._cmdHistory = S.get('cmdHistory') || [];
        UI._cmdHistoryPos = UI._cmdHistory.length;
        
        // ASCII Logo
        ASCII.logo.forEach(line => UI.print(line, 'bright'));
        
        // Check for first run
        if (Tutorial.isFirstRun()) {
            UI.print('First time? Try "tutorial"', 'info');
            UI.input.placeholder = 'tutorial';
        } else {
            UI.print('Ready.', 'dim');
        }
        
        UI.input.addEventListener('keydown', UI.handleKey);
        UI.input.addEventListener('input', UI.handleInput);
        
        // Mobile: tap on prompt to toggle autocomplete
        const prompt = document.querySelector('.cmd-prompt');
        if (prompt) {
            prompt.addEventListener('click', (e) => {
                e.preventDefault();
                if (UI._acVisible) {
                    UI.hideAutocomplete();
                } else {
                    UI.showAutocomplete();
                }
                UI.input.focus();
            });
        }
        
        UI.updateAll();
        UI.input.focus();
        
        // Live HUD update every 1s for ambient timer
        UI._hudInterval = setInterval(() => { if (SM.active()) UI.updateHUD(); }, 1000);
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
    },
    
    handleKey(e) {
        // Tab - autocomplete
        if (e.key === 'Tab') {
            e.preventDefault();
            if (!UI._acVisible) {
                UI.showAutocomplete();
            } else {
                UI.selectAutocomplete();
            }
            return;
        }
        
        // Escape - close autocomplete
        if (e.key === 'Escape') {
            UI.hideAutocomplete();
            return;
        }
        
        // Arrow navigation in autocomplete
        if (UI._acVisible && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
            e.preventDefault();
            UI.navigateAutocomplete(e.key === 'ArrowDown' ? 1 : -1);
            return;
        }
        
        // Command history
        if (!UI._acVisible && e.key === 'ArrowUp') {
            e.preventDefault();
            if (UI._cmdHistory.length === 0) return;
            UI._cmdHistoryPos = Math.max(0, UI._cmdHistoryPos - 1);
            UI.input.value = UI._cmdHistory[UI._cmdHistoryPos] || '';
            return;
        }
        if (!UI._acVisible && e.key === 'ArrowDown') {
            e.preventDefault();
            if (UI._cmdHistory.length === 0) return;
            UI._cmdHistoryPos = Math.min(UI._cmdHistory.length, UI._cmdHistoryPos + 1);
            UI.input.value = UI._cmdHistoryPos === UI._cmdHistory.length ? '' : (UI._cmdHistory[UI._cmdHistoryPos] || '');
            return;
        }
        
        // Enter - execute
        if (e.key === 'Enter') {
            if (UI._acVisible) {
                UI.selectAutocomplete();
                return;
            }
            const cmd = UI.input.value.trim();
            UI.input.value = '';
            if (!cmd) return;
            
            UI._cmdHistory.push(cmd);
            UI._cmdHistory = UI._cmdHistory.slice(-50);
            UI._cmdHistoryPos = UI._cmdHistory.length;
            S.set('cmdHistory', UI._cmdHistory);
            
            UI.exec(cmd);
        }
    },
    
    handleInput() {
        if (UI._acVisible) UI.updateAutocomplete();
    },
    
    // === AUTOCOMPLETE ===
    showAutocomplete() {
        const prefix = UI.input.value.toLowerCase().trim();
        
        let cmds = COMMANDS.filter(c => {
            if (c.ctx === 'any') return true;
            if (c.ctx === 'idle' && !SM.active()) return true;
            if (c.ctx === 'active' && SM.active()) return true;
            if (c.ctx === 'has_task' && SM.hasTask()) return true;
            return false;
        });
        
        if (prefix) {
            cmds = cmds.filter(c => c.cmd.startsWith(prefix));
        }
        
        if (cmds.length === 0) {
            UI.hideAutocomplete();
            return;
        }
        
        UI.autocomplete.innerHTML = cmds.map((c, i) => 
            `<div class="ac-item${i === 0 ? ' selected' : ''}" data-cmd="${c.cmd}" data-usage="${c.usage}">
                <span class="ac-item-cmd">${c.cmd}</span>
                <span class="ac-item-desc">${c.desc}</span>
            </div>`
        ).join('');
        
        UI.autocomplete.querySelectorAll('.ac-item').forEach(el => {
            el.addEventListener('click', () => {
                UI.input.value = el.dataset.cmd + ' ';
                UI.hideAutocomplete();
                UI.input.focus();
            });
        });
        
        UI._acIndex = 0;
        UI._acVisible = true;
        UI.autocomplete.classList.add('visible');
    },
    
    updateAutocomplete() {
        const prefix = UI.input.value.toLowerCase().trim();
        const items = UI.autocomplete.querySelectorAll('.ac-item');
        let visibleCount = 0;
        
        items.forEach(el => {
            const matches = el.dataset.cmd.startsWith(prefix);
            el.style.display = matches ? '' : 'none';
            if (matches) visibleCount++;
        });
        
        if (visibleCount === 0) UI.hideAutocomplete();
    },
    
    navigateAutocomplete(dir) {
        const items = [...UI.autocomplete.querySelectorAll('.ac-item')].filter(el => el.style.display !== 'none');
        if (items.length === 0) return;
        
        items.forEach(el => el.classList.remove('selected'));
        UI._acIndex = (UI._acIndex + dir + items.length) % items.length;
        items[UI._acIndex].classList.add('selected');
        items[UI._acIndex].scrollIntoView({ block: 'nearest' });
    },
    
    selectAutocomplete() {
        const selected = UI.autocomplete.querySelector('.ac-item.selected');
        if (selected) {
            UI.input.value = selected.dataset.cmd + ' ';
        }
        UI.hideAutocomplete();
        UI.input.focus();
    },
    
    hideAutocomplete() {
        UI._acVisible = false;
        UI._acIndex = -1;
        UI.autocomplete.classList.remove('visible');
    },
    
    // === QUICK ACTIONS ===
    updateQuickActions() {
        const btns = [];
        
        if (!SM.active()) {
            btns.push({ label: 'ENTER', cmd: 'enter ', primary: true });
            btns.push({ label: 'HISTORY', cmd: 'history' });
        } else {
            // Always show TASK - can add multiple
            btns.push({ label: 'TASK', cmd: 'task ', primary: !SM.hasTask() });
            
            if (SM.hasTask()) {
                btns.push({ label: 'DONE', cmd: 'done', primary: true });
                btns.push({ label: 'FAIL', cmd: 'fail ' });
                if (SM.taskCount() > 1) {
                    btns.push({ label: 'TASKS', cmd: 'tasks' });
                }
            }
            
            btns.push({ label: 'DECIDE', cmd: 'decide ' });
            btns.push({ label: 'EXIT', cmd: 'exit', warn: true });
        }
        
        UI.quickActions.innerHTML = btns.map(b => {
            const cls = `quick-btn${b.primary ? ' primary' : ''}${b.warn ? ' warn' : ''}`;
            return `<button class="${cls}" data-cmd="${b.cmd}">${b.label}</button>`;
        }).join('');
        
        UI.quickActions.querySelectorAll('.quick-btn').forEach(el => {
            el.addEventListener('click', () => {
                const cmd = el.dataset.cmd;
                if (cmd.endsWith(' ')) {
                    UI.input.value = cmd;
                    UI.input.focus();
                } else {
                    UI.exec(cmd);
                }
            });
        });
    },
    
    // === HUD ===
    updateHUD() {
        if (!SM.active()) {
            UI.hud.classList.remove('visible');
            UI.terminal.classList.remove('with-hud');
            return;
        }
        
        UI.hud.classList.add('visible');
        UI.terminal.classList.add('with-hud');
        
        const st = SM.status();
        
        // Session with ambient timer (h:mm:ss)
        const sessionEl = $('hudSession');
        const h = Math.floor(st.durationSec / 3600);
        const m = Math.floor((st.durationSec % 3600) / 60);
        const s = st.durationSec % 60;
        const timer = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        sessionEl.querySelector('span').textContent = timer;
        
        // Intent (visible on tablets)
        const intentEl = $('hudIntent');
        if (intentEl) {
            const intentText = st.session.intent.length > 25 
                ? st.session.intent.slice(0, 25) + '..' 
                : st.session.intent;
            intentEl.querySelector('span').textContent = intentText;
        }
        
        // Tasks (show focus task with numeric ID)
        const taskEl = $('hudTask');
        if (st.taskCount > 0) {
            const focusTask = st.focusTask || st.activeTasks[st.activeTasks.length - 1];
            const label = st.taskCount > 1 
                ? `${st.taskCount} active #${focusTask.num}` 
                : `#${focusTask.num} ${focusTask.label.slice(0, 12)}${focusTask.label.length > 12 ? '..' : ''}`;
            taskEl.querySelector('span').textContent = label;
        } else {
            taskEl.querySelector('span').textContent = '—';
        }
        
        // Load
        const loadEl = $('hudLoad');
        loadEl.querySelector('span').textContent = `${st.load.level} ${st.load.score}`;
        loadEl.className = 'hud-item';
        if (st.load.level === 'HIGH') loadEl.classList.add('warn');
        if (st.load.level === 'CRITICAL') loadEl.classList.add('err');
        
        // Streak
        const streakEl = $('hudStreak');
        if (st.streak > 0) {
            streakEl.querySelector('span').textContent = `${st.streak} done`;
            streakEl.style.display = '';
        } else {
            streakEl.style.display = 'none';
        }
        
        // Load warnings with cooldown (10 min = 600000ms)
        const now = Date.now();
        const cooldown = 600000;
        const levelOrder = { 'LOW': 0, 'MED': 1, 'HIGH': 2, 'CRITICAL': 3 };
        const currentLevel = levelOrder[st.load.level] || 0;
        const lastLevel = levelOrder[UI._lastLoadWarn] || 0;
        
        // Only warn on increase to HIGH or CRITICAL, with cooldown
        if (currentLevel >= 2 && currentLevel > lastLevel) {
            if (now - UI._lastLoadWarnTime > cooldown) {
                if (st.load.level === 'HIGH') UI.print('!! HIGH LOAD — consider wrapping up', 'warn');
                if (st.load.level === 'CRITICAL') UI.print('!! CRITICAL LOAD — take a break', 'error');
                UI._lastLoadWarnTime = now;
            }
        }
        UI._lastLoadWarn = st.load.level;
        
        // FLATLINE detection: auto-exit at extreme load
        const cfg = S.config();
        const flatlineScore = cfg.flatlineScore || 85;
        if (st.load.score >= flatlineScore && !UI._flatlineTriggered) {
            UI._flatlineTriggered = true;
            UI.print('', '');
            UI.print('!! ═══════════════════════════════════════ !!', 'error');
            UI.print('!!              F L A T L I N E             !!', 'error');
            UI.print('!! ═══════════════════════════════════════ !!', 'error');
            UI.print(`!! Load ${st.load.score}% exceeded threshold ${flatlineScore}%`, 'error');
            UI.print('!! Session auto-saved. Take a break.        !!', 'error');
            UI.print('!! ═══════════════════════════════════════ !!', 'error');
            // Auto-exit
            try {
                const r = SM.exit('FLATLINE', `Auto-exit: load ${st.load.score}%`);
                UI.print(`Session saved: ${r.duration}, ${r.stats.completed} tasks done`, 'dim');
            } catch(e) {}
            UI.updateAll();
        }
    },
    
    // === STATUS BAR ===
    updateStatus() {
        if (SM.active()) {
            UI.status.textContent = 'ACTIVE';
            UI.status.classList.add('active');
        } else {
            UI.status.textContent = 'IDLE';
            UI.status.classList.remove('active');
        }
    },
    
    updatePlaceholder() {
        if (!SM.active()) {
            UI.input.placeholder = 'enter <intent> | history | help';
        } else if (!SM.hasTask()) {
            UI.input.placeholder = 'task <desc> | decide | exit';
        } else {
            UI.input.placeholder = 'done [id] | fail [id] | task | tasks';
        }
    },
    
    updateAll() {
        UI.updateStatus();
        UI.updateHUD();
        UI.updateQuickActions();
        UI.updatePlaceholder();
        UI.hideAutocomplete();
    },
    
    // Check if user is near bottom of page (within threshold)
    isNearBottom(threshold = 100) {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const windowHeight = window.innerHeight;
        const docHeight = document.documentElement.scrollHeight;
        return (docHeight - scrollTop - windowHeight) < threshold;
    },
    
    print(text, cls = '') {
        const wasNearBottom = UI.isNearBottom(100);
        const div = document.createElement('div');
        div.className = `line ${cls}`;
        div.textContent = text;
        UI.output.appendChild(div);
        // Only autoscroll if user was near bottom
        if (wasNearBottom) {
            window.scrollTo(0, document.body.scrollHeight);
        }
    },
    
    exec(input) {
        UI.print(`> ${input}`, 'dim');
        
        // Check tutorial progress
        Tutorial.check(input);
        
        // Handle !! (repeat last command)
        if (input.trim() === '!!') {
            const lastCmd = S.lastCmd();
            if (!lastCmd) {
                UI.print('ERR: No previous command', 'error');
                return;
            }
            UI.print(`  (repeating: ${lastCmd})`, 'dim');
            input = lastCmd;
        }
        
        const parts = input.trim().split(/\s+/);
        let cmd = parts[0].toLowerCase();
        let args = parts.slice(1).join(' ');
        
        // Smart input: detect if this is a known command or freeform
        const knownCmds = COMMANDS.map(c => c.cmd);
        const aliases = {
            e: 'enter', start: 'enter', begin: 'enter',
            x: 'exit', end: 'exit', quit: 'exit',
            t: 'task', add: 'task',
            d: 'done', complete: 'done', finish: 'done',
            f: 'fail',
            dec: 'decide',
            s: 'status', st: 'status',
            ts: 'tasks',
            decs: 'decisions',
            l: 'load',
            p: 'plan',
            h: 'history', hist: 'history', ls: 'history',
            r: 'report', view: 'report', show: 'report',
            '?': 'help',
            cls: 'clear',
            cfg: 'config'
        };
        
        const resolvedCmd = aliases[cmd] || cmd;
        const isKnownCmd = knownCmds.includes(resolvedCmd) || Object.keys(aliases).includes(cmd);
        
        // Freeform input handling
        if (!isKnownCmd && input.trim().length > 0) {
            const trimmed = input.trim();
            
            // Decision shorthand: ? choice | reason  OR  dec: choice | reason
            if (trimmed.startsWith('?') || trimmed.toLowerCase().startsWith('dec:')) {
                if (SM.active()) {
                    const text = trimmed.startsWith('?') ? trimmed.slice(1).trim() : trimmed.slice(4).trim();
                    cmd = 'decide';
                    args = text.replace('|', '::');
                } else {
                    UI.print('ERR: No active session for decision', 'error');
                    UI.updateAll();
                    return;
                }
            }
            // IDLE: freeform text → enter <intent>
            else if (!SM.active()) {
                cmd = 'enter';
                args = trimmed;
            }
            // ACTIVE: freeform text → task <label>
            else {
                cmd = 'task';
                args = trimmed;
            }
        }
        
        // Save command for !! (but not !! itself)
        if (input.trim() !== '!!') {
            S.setLastCmd(input.trim());
        }
        
        try {
            UI.handle(resolvedCmd === cmd ? cmd : resolvedCmd, args);
        } catch (e) {
            UI.printError(e, cmd);
        }
        
        UI.updateAll();
    },
    
    // Print error with suggestions
    printError(e, cmd) {
        const msg = typeof e === 'string' ? e : e.message;
        UI.print(msg, 'error');
        
        // If unknown command, suggest similar
        if (msg.includes('Unknown')) {
            const suggestions = COMMANDS
                .map(c => c.cmd)
                .filter(c => c.startsWith(cmd[0]) || c.includes(cmd.slice(0,2)))
                .slice(0, 3);
            if (suggestions.length > 0) {
                UI.print(`  Try: ${suggestions.join(' | ')}`, 'hint');
            }
        }
    },
    
    handle(cmd, args) {
        const aliases = {
            e: 'enter', start: 'enter', begin: 'enter',
            x: 'exit', end: 'exit', quit: 'exit',
            t: 'task', add: 'task',
            d: 'done', complete: 'done', finish: 'done',
            f: 'fail',
            dec: 'decide',
            s: 'status', st: 'status',
            ts: 'tasks',
            decs: 'decisions',
            l: 'load',
            p: 'plan',
            h: 'history', hist: 'history', ls: 'history',
            r: 'report', view: 'report', show: 'report',
            '?': 'help',
            cls: 'clear',
            cfg: 'config'
        };
        
        const c = aliases[cmd] || cmd;
        
        switch (c) {
            case 'enter': {
                const s = SM.enter(args);
                UI._flatlineTriggered = false; // Reset flatline
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print('| >> SESSION STARTED                         |', 'bright');
                UI.print('+--------------------------------------------+', 'bright');
                UI.print(`| ${s.intent.slice(0,42).padEnd(42)} |`, 'info');
                if (s.importedPlan > 0) {
                    UI.print(`| Imported ${s.importedPlan} planned task(s)`.padEnd(43) + ' |', 'dim');
                }
                UI.print('+============================================+', 'bright');
                break;
            }
            
            case 'again': {
                if (SM.active()) throw 'ERR: Session active. Use "exit" first.';
                const lastIntent = S.lastIntent();
                const intent = args || lastIntent;
                if (!intent) throw 'ERR: No previous intent. Usage: again [intent]';
                UI.handle('enter', intent);
                break;
            }
            
            case 'exit': {
                const parts = args.split(/\s+/);
                const outcomes = ['completed', 'aborted', 'timeout'];
                let outcome = 'COMPLETED', summary = args;
                if (parts[0] && outcomes.includes(parts[0].toLowerCase())) {
                    outcome = parts.shift().toUpperCase();
                    summary = parts.join(' ');
                }
                const r = SM.exit(outcome, summary);
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print('| ## SESSION ENDED                           |', 'bright');
                UI.print('+--------------------------------------------+', 'bright');
                UI.print(`| Duration: ${r.duration.padEnd(32)} |`);
                UI.print(`| Tasks: ${r.stats.completed} done, ${r.stats.failed} failed`.padEnd(43) + ' |');
                UI.print(`| Load: ${r.load.level} (${r.load.score}/100)`.padEnd(43) + ' |');
                UI.print('+============================================+', 'bright');
                break;
            }
            
            case 'task': {
                const t = SM.task(args);
                const label = t.label.length > 32 ? t.label.slice(0, 32) + '..' : t.label;
                UI.print('');
                UI.print('+============================================+', 'info');
                UI.print(`| #${t.num} ${label.padEnd(38)} |`, 'info');
                UI.print('+============================================+', 'info');
                if (t.total > 1) UI.print(`  ${t.total} tasks active`, 'dim');
                break;
            }
            
            case 'done': {
                const t = SM.done(args || null);
                const label = t.label.length > 32 ? t.label.slice(0, 32) + '..' : t.label;
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print(`| + COMPLETED #${t.num}`.padEnd(43) + ' |', 'bright');
                UI.print('+--------------------------------------------+', 'bright');
                UI.print(`| ${label.padEnd(42)} |`);
                UI.print(`| Duration: ${t.duration.padEnd(32)} |`, 'dim');
                if (t.streak > 1) {
                    UI.print(`| Streak: ${t.streak} tasks in a row!`.padEnd(43) + ' |', 'info');
                }
                UI.print('+============================================+', 'bright');
                if (t.remaining > 0) UI.print(`  ${t.remaining} task(s) remaining`, 'dim');
                break;
            }
            
            case 'fail': {
                const t = SM.fail(args);
                const label = t.label.length > 32 ? t.label.slice(0, 32) + '..' : t.label;
                UI.print('');
                UI.print('+============================================+', 'error');
                UI.print(`| x FAILED #${t.num}`.padEnd(43) + ' |', 'error');
                UI.print('+--------------------------------------------+', 'error');
                UI.print(`| ${label.padEnd(42)} |`);
                UI.print('+============================================+', 'error');
                if (t.remaining > 0) UI.print(`  ${t.remaining} task(s) remaining`, 'dim');
                break;
            }
            
            case 'drop': {
                const t = SM.drop(args || null);
                const label = t.label.length > 32 ? t.label.slice(0, 32) + '..' : t.label;
                UI.print('');
                UI.print('+============================================+', 'warn');
                UI.print(`| - DROPPED #${t.num}`.padEnd(43) + ' |', 'warn');
                UI.print('+--------------------------------------------+', 'warn');
                UI.print(`| ${label.padEnd(42)} |`);
                UI.print('+============================================+', 'warn');
                if (t.remaining > 0) UI.print(`  ${t.remaining} task(s) remaining`, 'dim');
                break;
            }
            
            case 'focus': {
                if (!SM.session) throw 'ERR: No active session.';
                if (!SM.hasTask()) throw 'ERR: No active tasks.';
                
                if (!args) {
                    // Show current focus task
                    const ft = SM.getFocusTask();
                    if (ft) {
                        const dur = Math.round((Date.now() - new Date(ft.startedAt)) / 60000);
                        UI.print('');
                        UI.print('+============================================+', 'bright');
                        UI.print('| >> FOCUS TASK                              |', 'bright');
                        UI.print('+--------------------------------------------+', 'bright');
                        UI.print(`| #${ft.num} ${ft.label.slice(0,36).padEnd(36)} |`, 'info');
                        UI.print(`| Duration: ${dur}m`.padEnd(43) + ' |', 'dim');
                        UI.print('+============================================+', 'bright');
                    } else {
                        UI.print('NO FOCUS TASK', 'dim');
                    }
                } else {
                    // Set focus task
                    const t = SM.setFocus(args);
                    UI.print(`Focus set to: #${t.num} ${t.label.slice(0,30)}`, 'info');
                }
                break;
            }
            
            case 'decide': {
                const d = SM.decide(args);
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print('| DECISION                                   |', 'bright');
                UI.print('+--------------------------------------------+', 'bright');
                UI.print(`| ${d.choice.slice(0,42).padEnd(42)} |`, 'info');
                UI.print('+--------------------------------------------+', 'dim');
                UI.print(`| Reason: ${d.reason.slice(0,34).padEnd(34)} |`, 'dim');
                UI.print('+============================================+', 'dim');
                break;
            }
            
            case 'status': {
                const st = SM.status();
                if (!st) { UI.print('No active session.', 'dim'); break; }
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print('| ** CURRENT SESSION                         |', 'bright');
                UI.print('+--------------------------------------------+', 'bright');
                UI.print(`| Intent: ${st.session.intent.slice(0,34).padEnd(34)} |`);
                UI.print(`| Duration: ${st.duration.padEnd(32)} |`);
                UI.print(`| Tasks: ${st.stats.completed} done, ${st.stats.failed} failed`.padEnd(43) + ' |');
                UI.print(`| Load: ${st.load.level} (${st.load.score}/100)`.padEnd(43) + ' |');
                UI.print('+--------------------------------------------+', 'info');
                if (st.taskCount > 0) {
                    UI.print(`| Active Tasks: ${st.taskCount}`.padEnd(43) + ' |', 'info');
                    st.activeTasks.forEach(t => {
                        const marker = t.isFocus ? '>' : ' ';
                        UI.print(`| ${marker} #${t.num} ${t.label.slice(0,32).padEnd(32)} |`, t.isFocus ? 'bright' : 'info');
                    });
                } else {
                    UI.print('| No active tasks                            |', 'dim');
                }
                UI.print('+============================================+', 'bright');
                break;
            }
            
            case 'tasks': {
                const ts = SM.getTasks();
                if (ts.length === 0) { UI.print('No tasks in session.', 'dim'); break; }
                
                const active = ts.filter(t => t.status === 'ACTIVE');
                const finished = ts.filter(t => t.status !== 'ACTIVE');
                const focusNum = SM.focusTaskNum;
                
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print(`| ## TASKS (${ts.length})`.padEnd(43) + ' |', 'bright');
                UI.print('+--------------------------------------------+', 'bright');
                
                if (active.length > 0) {
                    UI.print('| -- Active --                               |', 'info');
                    active.forEach(t => {
                        const dur = Math.round((Date.now() - new Date(t.startedAt)) / 60000);
                        const isFocus = t.num === focusNum;
                        const marker = isFocus ? '>' : '*';
                        const planned = t.planned ? 'P' : ' ';
                        const label = t.label.slice(0, 28);
                        UI.print(`| ${marker} ${String(t.num).padStart(2)} ${label.padEnd(28)} ${planned} ${String(dur).padStart(3)}m |`, isFocus ? 'bright' : 'info');
                    });
                }
                
                if (finished.length > 0) {
                    UI.print('| -- Completed --                            |', 'dim');
                    finished.forEach(t => {
                        const icon = t.status === 'DONE' ? '+' : t.status === 'FAIL' ? 'x' : '-';
                        const dur = t.durationMin !== undefined ? `${t.durationMin}m` : '--';
                        const label = t.label.slice(0, 28);
                        const cls = t.status === 'FAIL' ? 'error' : t.status === 'DROP' ? 'warn' : 'dim';
                        UI.print(`| ${icon} ${String(t.num).padStart(2)} ${label.padEnd(28)}   ${dur.padStart(4)} |`, cls);
                    });
                }
                
                UI.print('+============================================+', 'bright');
                break;
            }
            
            case 'decisions': {
                const ds = SM.getDecisions();
                if (ds.length === 0) { UI.print('No decisions recorded.', 'dim'); break; }
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print(`| ## DECISIONS (${ds.length})`.padEnd(43) + ' |', 'bright');
                UI.print('+--------------------------------------------+', 'bright');
                ds.forEach(d => {
                    const time = new Date(d.timestamp).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                    UI.print(`| [${time}] ${d.choice.slice(0,34).padEnd(34)} |`);
                });
                UI.print('+============================================+', 'bright');
                break;
            }
            
            case 'load': {
                const st = SM.status();
                if (!st) { UI.print('No active session.', 'dim'); break; }
                const l = st.load;
                const cls = l.level === 'CRITICAL' ? 'error' : l.level === 'HIGH' ? 'warn' : 'bright';
                
                const width = 24;
                const filled = Math.round((l.score / 100) * width);
                const bar = '#'.repeat(filled) + '-'.repeat(width - filled);
                
                UI.print('');
                UI.print('+============================================+', cls);
                UI.print('| ## COGNITIVE LOAD                          |', cls);
                UI.print('+--------------------------------------------+', cls);
                UI.print(`| [${bar}] ${String(l.score).padStart(3)}%          |`, cls);
                UI.print(`| Level: ${l.level.padEnd(34)} |`, cls);
                UI.print('+--------------------------------------------+', cls);
                UI.print(`| Duration factor: ${String(l.factors.duration.penalty).padStart(2)}pts`.padEnd(43) + ' |', 'dim');
                UI.print(`| Task switches:   ${String(l.factors.switchRate.penalty).padStart(2)}pts`.padEnd(43) + ' |', 'dim');
                UI.print(`| Error rate:      ${String(l.factors.errors.penalty).padStart(2)}pts`.padEnd(43) + ' |', 'dim');
                UI.print('+============================================+', cls);
                break;
            }
            
            case 'history': {
                const arg = args.trim();
                
                // history <n> - open report for n-th session from last history
                if (arg && /^\d+$/.test(arg)) {
                    const idx = parseInt(arg) - 1;
                    if (UI._lastHistorySessions.length === 0) {
                        // No cached history, get sessions first
                        UI._lastHistorySessions = SM.getSessions().slice(0, 10);
                    }
                    if (idx < 0 || idx >= UI._lastHistorySessions.length) {
                        throw `OUT OF RANGE: 1-${UI._lastHistorySessions.length}`;
                    }
                    const s = UI._lastHistorySessions[idx];
                    // Show report for this session
                    UI.handle('report', s.id);
                    break;
                }
                
                // history [count] - show list
                const n = parseInt(arg) || 10;
                const sessions = SM.getSessions().slice(0, n);
                UI._lastHistorySessions = sessions; // Cache for quick access
                
                if (sessions.length === 0) { UI.print('No session history.', 'dim'); break; }
                
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print(`| >> SESSION HISTORY (${sessions.length})`.padEnd(43) + ' |', 'bright');
                UI.print('+--------------------------------------------+', 'bright');
                UI.print('| #   ID     DATE     DUR   LOAD  INTENT     |', 'dim');
                UI.print('+--------------------------------------------+', 'dim');
                
                sessions.forEach((s, i) => {
                    const num = String(i + 1).padStart(2);
                    const shortId = s.id.slice(-4);
                    const date = new Date(s.startedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                    const intent = s.intent.slice(0, 10);
                    const cls = s.load.level === 'HIGH' || s.load.level === 'CRITICAL' ? 'warn' : '';
                    UI.print(`| ${num} ${shortId} ${date.padEnd(6)} ${s.duration.padEnd(4)} ${s.load.level.padEnd(5)} ${intent.padEnd(10)} |`, cls);
                });
                
                UI.print('+============================================+', 'bright');
                UI.print('  history <#> to view report', 'hint');
                break;
            }
            
            case 'report': {
                let s = null;
                let isActive = false;
                
                if (!args) {
                    // Smart default: last completed session, or active if no completed
                    const sessions = SM.getSessions();
                    if (sessions.length > 0) {
                        s = sessions[0]; // Most recent completed
                    } else if (SM.active()) {
                        isActive = true;
                    } else {
                        throw 'NO SESSIONS';
                    }
                } else if (args.toLowerCase() === 'active') {
                    // Report for active session
                    if (!SM.active()) throw 'NO ACTIVE SESSION';
                    isActive = true;
                } else {
                    // Find by ID
                    s = SM.getSession(args);
                    if (!s) throw `Session not found: ${args}`;
                }
                
                // Build report data
                let reportData;
                if (isActive) {
                    const st = SM.status();
                    const tasks = SM.getTasks();
                    const decisions = SM.getDecisions();
                    reportData = {
                        intent: st.session.intent,
                        duration: st.duration,
                        outcome: 'IN PROGRESS',
                        load: st.load,
                        stats: st.stats,
                        tasks: tasks,
                        decisions: decisions,
                        isActive: true
                    };
                } else {
                    const tasks = SM.getSessionTasks(s.id);
                    const decisions = SM.getDecisions(s.id);
                    reportData = {
                        intent: s.intent,
                        duration: s.duration,
                        outcome: s.outcome,
                        load: s.load,
                        stats: s.stats,
                        tasks: tasks,
                        decisions: decisions,
                        isActive: false
                    };
                }
                
                const l = reportData.load;
                const loadCls = l.level === 'CRITICAL' ? 'error' : l.level === 'HIGH' ? 'warn' : 'bright';
                const outcomeCls = reportData.outcome === 'COMPLETED' ? 'bright' : reportData.isActive ? 'info' : 'warn';
                
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print(`| ** SESSION REPORT${reportData.isActive ? ' (ACTIVE)' : ''}`.padEnd(43) + ' |', 'bright');
                UI.print('+--------------------------------------------+', 'bright');
                UI.print(`| ${reportData.intent.slice(0,42).padEnd(42)} |`, 'info');
                UI.print('+--------------------------------------------+', 'bright');
                UI.print(`| Duration: ${reportData.duration.padEnd(32)} |`);
                UI.print(`| Outcome:  ${reportData.outcome.padEnd(32)} |`, outcomeCls);
                UI.print(`| Load:     ${l.level} (${l.score}/100)`.padEnd(43) + ' |', loadCls);
                UI.print(`| Tasks:    ${reportData.stats.completed} done, ${reportData.stats.failed} failed`.padEnd(43) + ' |');
                
                if (reportData.tasks.length > 0) {
                    UI.print('+--------------------------------------------+', 'bright');
                    UI.print('| ## Tasks                                   |', 'bright');
                    reportData.tasks.forEach(t => {
                        const icon = t.status === 'DONE' ? '+' : t.status === 'FAIL' ? 'x' : t.status === 'ACTIVE' ? '*' : '-';
                        const dur = t.durationMin !== undefined ? `${t.durationMin}m` : '--';
                        const label = t.label.slice(0, 30);
                        const cls = t.status === 'DONE' ? 'bright' : t.status === 'FAIL' ? 'error' : t.status === 'ACTIVE' ? 'info' : 'warn';
                        UI.print(`| ${icon} ${label.padEnd(30)} ${dur.padStart(6)} |`, cls);
                    });
                }
                
                if (reportData.decisions.length > 0) {
                    UI.print('+--------------------------------------------+', 'bright');
                    UI.print('| ## Decisions                               |', 'bright');
                    reportData.decisions.forEach(d => {
                        const time = new Date(d.timestamp).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
                        UI.print(`| ${time} ${d.choice.slice(0,36).padEnd(36)} |`, 'info');
                        if (d.reason) {
                            UI.print(`|      >> ${d.reason.slice(0,33).padEnd(33)} |`, 'dim');
                        }
                    });
                }
                
                UI.print('+============================================+', 'bright');
                
                // Save report for copy/share
                UI._lastReport = [
                    `SESSION REPORT${reportData.isActive ? ' (ACTIVE)' : ''}`,
                    `Intent: ${reportData.intent}`,
                    `Duration: ${reportData.duration}`,
                    `Outcome: ${reportData.outcome}`,
                    `Load: ${reportData.load.level} (${reportData.load.score}/100)`,
                    `Tasks: ${reportData.stats.completed} done, ${reportData.stats.failed} failed`,
                    reportData.tasks.length > 0 ? `\nTasks:\n${reportData.tasks.map(t => `  ${t.status === 'DONE' ? '+' : t.status === 'FAIL' ? 'x' : '*'} ${t.label}`).join('\n')}` : '',
                    reportData.decisions.length > 0 ? `\nDecisions:\n${reportData.decisions.map(d => `  ${d.choice}: ${d.reason}`).join('\n')}` : ''
                ].filter(Boolean).join('\n');
                break;
            }
            
            case 'export': {
                const fmt = args.toLowerCase() || 'json';
                if (fmt === 'json') UI.print(Export.json(), 'bright');
                else if (fmt === 'csv') UI.print(Export.csv(), 'bright');
                else throw 'ERR: Use: export json | export csv';
                break;
            }
            
            case 'config': {
                const cfg = S.config();
                if (!args) {
                    UI.print('CONFIG', 'bright');
                    UI.print(`safeWindowMinutes: ${cfg.safeWindowMinutes || 90}`);
                    UI.print(`flatlineScore: ${cfg.flatlineScore || 85}`);
                    UI.print(`scanlines: ${cfg.scanlines !== false ? 'on' : 'off'}`);
                    UI.print(`planKeep: ${cfg.planKeep ? 'on' : 'off'}`);
                    UI.print('');
                    UI.print('Use: config <key> <value>', 'hint');
                } else {
                    const [key, ...vals] = args.split(/\s+/);
                    const val = vals.join(' ').toLowerCase();
                    if (key === 'safeWindowMinutes') {
                        const n = parseInt(val);
                        if (!n || n < 1) throw 'ERR: Must be positive integer.';
                        cfg.safeWindowMinutes = n;
                        S.set('config', cfg);
                        UI.print(`safeWindowMinutes = ${n}`, 'bright');
                    } else if (key === 'flatlineScore') {
                        const n = parseInt(val);
                        if (!n || n < 50 || n > 100) throw 'ERR: Must be 50-100.';
                        cfg.flatlineScore = n;
                        S.set('config', cfg);
                        UI.print(`flatlineScore = ${n}`, 'bright');
                    } else if (key === 'planKeep') {
                        cfg.planKeep = val === 'on' || val === 'true' || val === '1';
                        S.set('config', cfg);
                        UI.print(`planKeep = ${cfg.planKeep ? 'on' : 'off'}`, 'bright');
                    } else {
                        throw `ERR: Unknown key: ${key}`;
                    }
                }
                break;
            }
            
            case 'scanlines': {
                const cfg = S.config();
                const arg = args.toLowerCase().trim();
                if (arg === 'on' || arg === '1' || arg === 'true') {
                    cfg.scanlines = true;
                    S.set('config', cfg);
                    document.body.classList.remove('no-scanlines');
                    UI.print('Scanlines: ON', 'bright');
                } else if (arg === 'off' || arg === '0' || arg === 'false') {
                    cfg.scanlines = false;
                    S.set('config', cfg);
                    document.body.classList.add('no-scanlines');
                    UI.print('Scanlines: OFF', 'dim');
                } else {
                    UI.print(`Scanlines: ${cfg.scanlines !== false ? 'ON' : 'OFF'}`);
                    UI.print('Use: scanlines on|off', 'hint');
                }
                break;
            }
            
            case 'plan': {
                const parts = args.trim().split(/\s+/);
                const subcmd = parts[0]?.toLowerCase() || '';
                const rest = parts.slice(1).join(' ');
                const planQueue = S.plan();
                
                if (!subcmd || subcmd === 'load') {
                    if (planQueue.length === 0) {
                        UI.print('Plan queue empty.', 'dim');
                        UI.print('  plan add <task>', 'hint');
                    } else {
                        UI.print('');
                        UI.print('+============================================+', 'info');
                        UI.print(`| >> PLAN QUEUE (${planQueue.length})`.padEnd(43) + ' |', 'info');
                        UI.print('+--------------------------------------------+', 'info');
                        planQueue.forEach((item, i) => {
                            UI.print(`| ${String(i+1).padStart(2)}. ${item.label.slice(0,38).padEnd(38)} |`);
                        });
                        UI.print('+============================================+', 'info');
                    }
                } else if (subcmd === 'add') {
                    if (!rest) throw 'ERR: plan add <task>';
                    planQueue.push({ label: rest, addedAt: new Date().toISOString() });
                    S.setPlan(planQueue);
                    UI.print(`Planned #${planQueue.length}: ${rest.slice(0,35)}`, 'info');
                } else if (subcmd === 'rm' || subcmd === 'remove') {
                    const idx = parseInt(rest) - 1;
                    if (isNaN(idx) || idx < 0 || idx >= planQueue.length) {
                        throw `ERR: Invalid index. Range: 1-${planQueue.length}`;
                    }
                    const removed = planQueue.splice(idx, 1)[0];
                    S.setPlan(planQueue);
                    UI.print(`Removed: ${removed.label.slice(0,40)}`, 'dim');
                } else if (subcmd === 'clear') {
                    S.setPlan([]);
                    UI.print('Plan cleared.', 'dim');
                } else {
                    const label = args.trim();
                    planQueue.push({ label, addedAt: new Date().toISOString() });
                    S.setPlan(planQueue);
                    UI.print(`Planned #${planQueue.length}: ${label.slice(0,35)}`, 'info');
                }
                break;
            }
            
            case 'template': {
                const parts = args.trim().split(/\s+/);
                const subcmd = parts[0]?.toLowerCase() || '';
                const name = parts.slice(1).join(' ') || parts[1];
                const templates = S.templates();
                
                if (!subcmd || subcmd === 'list') {
                    const names = Object.keys(templates);
                    if (names.length === 0) {
                        UI.print('No templates saved.', 'dim');
                        UI.print('  template save <name>', 'hint');
                    } else {
                        UI.print('');
                        UI.print('TEMPLATES:', 'bright');
                        names.forEach(n => {
                            const t = templates[n];
                            UI.print(`  ${n} (${t.tasks.length} tasks)`, 'info');
                        });
                    }
                } else if (subcmd === 'save') {
                    if (!name) throw 'ERR: template save <name>';
                    const planQueue = S.plan();
                    if (planQueue.length === 0) throw 'ERR: Plan queue empty. Add tasks first.';
                    templates[name] = {
                        tasks: planQueue.map(p => p.label),
                        savedAt: new Date().toISOString()
                    };
                    S.setTemplates(templates);
                    UI.print(`Template "${name}" saved (${planQueue.length} tasks)`, 'bright');
                } else if (subcmd === 'load') {
                    if (!name) throw 'ERR: template load <name>';
                    const t = templates[name];
                    if (!t) throw `ERR: Template "${name}" not found`;
                    const planQueue = t.tasks.map(label => ({ label, addedAt: new Date().toISOString() }));
                    S.setPlan(planQueue);
                    UI.print(`Loaded "${name}" → ${planQueue.length} tasks in plan`, 'info');
                } else if (subcmd === 'rm' || subcmd === 'remove' || subcmd === 'delete') {
                    if (!name) throw 'ERR: template rm <name>';
                    if (!templates[name]) throw `ERR: Template "${name}" not found`;
                    delete templates[name];
                    S.setTemplates(templates);
                    UI.print(`Template "${name}" deleted`, 'dim');
                } else {
                    throw 'ERR: template [list|save|load|rm] <name>';
                }
                break;
            }
            
            case 'find': {
                if (!args || args.length < 2) throw 'ERR: find <text> (min 2 chars)';
                const results = SM.find(args);
                if (results.length === 0) {
                    UI.print(`No results for "${args}"`, 'dim');
                } else {
                    UI.print(`Found ${results.length} for "${args}":`);
                    results.slice(0, 10).forEach(r => {
                        if (r.type === 'plan') {
                            UI.print(`  [PLAN] ${r.text.slice(0,38)}`, 'info');
                        } else {
                            UI.print(`  [#${r.historyIdx}] ${r.type}: ${r.text.slice(0,30)}`, 'dim');
                        }
                    });
                    if (results.length > 10) UI.print(`  +${results.length - 10} more`, 'dim');
                }
                break;
            }
            
            case 'last': {
                const sessions = SM.getSessions();
                if (sessions.length === 0) throw 'NO SESSIONS';
                UI.handle('report', sessions[0].id);
                break;
            }
            
            case 'copy': {
                if (args.toLowerCase() !== 'report') throw 'Usage: copy report';
                const text = UI._lastReport || 'No report yet.';
                navigator.clipboard.writeText(text).then(() => {
                    UI.print('Copied to clipboard.', 'bright');
                }).catch(() => {
                    UI.print('ERR: Clipboard denied.', 'error');
                });
                break;
            }
            
            case 'share': {
                if (args.toLowerCase() !== 'report') throw 'Usage: share report';
                const text = UI._lastReport || 'No report yet.';
                if (navigator.share) {
                    navigator.share({ title: 'OSC Report', text }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(text).then(() => {
                        UI.print('Copied (no share API).', 'bright');
                    }).catch(() => {
                        UI.print('ERR: Share unavailable.', 'error');
                    });
                }
                break;
            }
            
            case 'clear':
                UI.output.innerHTML = '';
                break;
            
            case 'tutorial':
                if (args === 'start' && Tutorial.active && Tutorial.step === 0) {
                    Tutorial.step = 1;
                    Tutorial.showStep();
                } else if (args === 'reset') {
                    Tutorial.reset();
                    UI.print('Tutorial reset. Type "tutorial" to start again.', 'bright');
                } else if (!Tutorial.active) {
                    Tutorial.start();
                } else {
                    UI.print('Tutorial in progress. Follow the instructions above.', 'dim');
                    const s = Tutorial.steps[Tutorial.step];
                    if (s && s.hint) UI.print(`  Try: ${s.hint}`, 'info');
                }
                break;
            
            case 'reset':
                if (args !== 'confirm') {
                    UI.print('This will DELETE ALL DATA.', 'warn');
                    UI.print('Type: reset confirm', 'warn');
                } else {
                    for (let i = localStorage.length - 1; i >= 0; i--) {
                        const k = localStorage.key(i);
                        if (k && k.startsWith('osc_')) localStorage.removeItem(k);
                    }
                    location.reload();
                }
                break;
            
            case 'help':
                UI.print('');
                UI.print('+============================================+', 'bright');
                UI.print('|       OSC — OPERATOR SESSION CONSOLE       |', 'bright');
                UI.print('+============================================+', 'bright');
                UI.print('');
                UI.print('SESSION', 'bright');
                UI.print('  enter <intent>        Start session');
                UI.print('  again [intent]        Re-enter (last intent)');
                UI.print('  exit [outcome]        End (completed/aborted)');
                UI.print('  status                Current status');
                UI.print('');
                UI.print('TASKS (numeric IDs: #1, #2...)', 'bright');
                UI.print('  task <desc>           Start task (→focus)');
                UI.print('  done [#]              Complete (focus)');
                UI.print('  fail [#] [reason]     Mark failed');
                UI.print('  drop [#]              Abandon task');
                UI.print('  focus [#]             Set/show focus');
                UI.print('  tasks                 List all');
                UI.print('');
                UI.print('PLANNING (preflight)', 'bright');
                UI.print('  plan                  Show plan queue');
                UI.print('  plan add <task>       Add to plan');
                UI.print('  plan rm <#>           Remove from plan');
                UI.print('  plan clear            Clear plan');
                UI.print('');
                UI.print('TEMPLATES (constructs)', 'bright');
                UI.print('  template              List saved');
                UI.print('  template save <name>  Save plan as template');
                UI.print('  template load <name>  Load template to plan');
                UI.print('  template rm <name>    Delete template');
                UI.print('');
                UI.print('DECISIONS', 'bright');
                UI.print('  decide <X> :: <Y>     Log decision');
                UI.print('  ? <X> | <Y>           Quick decision');
                UI.print('  decisions             List all');
                UI.print('');
                UI.print('VIEW', 'bright');
                UI.print('  history               Sessions list (#)');
                UI.print('  history <#>           Report by index');
                UI.print('  report [active]       Current/last session');
                UI.print('  last                  Last session report');
                UI.print('  find <text>           Search all data');
                UI.print('  load                  Cognitive load meter');
                UI.print('');
                UI.print('DATA', 'bright');
                UI.print('  copy report           Copy to clipboard');
                UI.print('  share report          Share API (mobile)');
                UI.print('  export json|csv       Export all data');
                UI.print('  config                Show settings');
                UI.print('  config <key> <val>    Change setting');
                UI.print('  scanlines on|off      CRT effect');
                UI.print('  reset confirm         DELETE ALL DATA');
                UI.print('');
                UI.print('SMART INPUT', 'bright');
                UI.print('  (any text)            IDLE→enter, ACT→task');
                UI.print('  ? choice | reason     Quick decision');
                UI.print('  !!                    Repeat last command');
                UI.print('');
                UI.print('OTHER', 'bright');
                UI.print('  tutorial              Interactive guide');
                UI.print('  clear                 Clear screen');
                UI.print('  help                  This reference');
                UI.print('');
                UI.print('HUD (always visible)', 'bright');
                UI.print('  SESSION h:mm:ss       Ambient timer');
                UI.print('  TASK #N               Focus task');
                UI.print('  LOAD level score      Cognitive load');
                UI.print('  STREAK N done         Consecutive completions');
                UI.print('');
                UI.print('SAFETY', 'bright');
                UI.print('  Flatline at 85%       Auto-exit (configurable)');
                UI.print('  config flatlineScore  Set threshold (50-100)');
                UI.print('');
                UI.print('+============================================+', 'bright');
                break;
            
            default:
                throw `ERR: Unknown: "${cmd}". Type "help".`;
        }
    }
};

// ===========================================================================
// INIT
// ===========================================================================

document.addEventListener('DOMContentLoaded', () => UI.init());
</script>
</body>
</html>
