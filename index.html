<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OSC">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="./manifest.json">
    
    <!-- Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <title>OSC</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; image-rendering: pixelated; }
        
        :root {
            --bg: #0a0a0a; --bg2: #111111; --bg3: #1a1a1a;
            --text: #00ff00; --dim: #006600; --bright: #44ff44;
            --warn: #ffcc00; --err: #ff3333; --info: #00aaff; --border: #333333;
        }
        
        body {
            font-family: 'Press Start 2P', monospace;
            background: var(--bg); color: var(--text);
            min-height: 100vh; font-size: 8px; line-height: 1.4;
        }
        
        /* CRT Scanlines */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 9999;
        }
        
        /* Disable scanlines */
        body.no-scanlines::before {
            display: none;
        }
        
        /* === STATUS BAR === */
        .status-bar {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--bg); border-bottom: 1px solid var(--border);
            padding: 5px 10px; padding-top: calc(5px + env(safe-area-inset-top));
            font-size: 8px; display: flex;
            justify-content: space-between; z-index: 10;
        }
        .status-left { color: var(--dim); }
        .status-right { color: var(--dim); }
        .status-right.active { color: var(--warn); }
        
        /* === HUD (Pinned Info) === */
        .hud {
            position: fixed; top: calc(28px + env(safe-area-inset-top)); left: 0; right: 0;
            background: var(--bg2); border-bottom: 1px solid var(--border);
            padding: 5px 10px; font-size: 8px; display: none;
            justify-content: space-between; z-index: 9;
        }
        .hud.visible { display: flex; }
        .hud-item { color: var(--dim); }
        .hud-item span { color: var(--text); }
        .hud-item.warn span { color: var(--warn); }
        .hud-item.err span { color: var(--err); }
        .hud-intent { display: none; } /* Hidden on mobile */
        
        /* === TERMINAL === */
        .terminal {
            min-height: 100vh;
            padding: 10px 12px;
            padding-top: calc(35px + env(safe-area-inset-top));
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
        }
        .terminal.with-hud { padding-top: calc(65px + env(safe-area-inset-top)); }
        
        .console-output {
            font-size: 8px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        
        .line { margin-bottom: 1px; }
        .line.error { color: var(--err); }
        .line.warn { color: var(--warn); }
        .line.dim { color: var(--dim); }
        .line.bright { color: var(--bright); }
        .line.info { color: var(--info); }
        .line.hint { color: #003300; font-style: italic; }
        
        /* === QUICK ACTIONS === */
        .quick-actions {
            position: fixed; bottom: calc(50px + env(safe-area-inset-bottom)); left: 0; right: 0;
            background: var(--bg); border-top: 1px solid var(--border);
            padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 5px;
            justify-content: center; z-index: 8;
        }
        .quick-btn {
            padding: 5px 10px; background: var(--bg2); border: 1px solid var(--border);
            color: var(--dim); font-family: inherit; font-size: 8px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
            transition: all 0.1s;
        }
        .quick-btn:active, .quick-btn.highlight {
            background: var(--text); color: var(--bg); border-color: var(--text);
        }
        .quick-btn.primary { border-color: var(--text); color: var(--text); }
        .quick-btn.warn { border-color: var(--warn); color: var(--warn); }
        .quick-btn.hidden { display: none; }
        
        /* === COMMAND BAR === */
        .cmd-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg); border-top: 1px solid var(--border);
            padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: flex; align-items: center; gap: 8px;
        }
        .cmd-prompt { color: var(--bright); font-weight: bold; cursor: pointer; padding: 10px 5px 10px 0; }
        .cmd-input {
            flex: 1; background: transparent; border: none; color: var(--text);
            font-family: inherit; font-size: 8px; outline: none;
        }
        .cmd-input::placeholder { color: var(--dim); }
        
        /* === AUTOCOMPLETE === */
        .autocomplete {
            position: fixed; bottom: calc(80px + env(safe-area-inset-bottom)); left: 12px; right: 12px;
            background: var(--bg2); border: 1px solid var(--border);
            display: none; max-height: 120px; overflow-y: auto; z-index: 20;
        }
        .autocomplete.visible { display: block; }
        .ac-item {
            padding: 6px 10px; cursor: pointer; font-size: 8px;
            display: flex; justify-content: space-between;
        }
        .ac-item:hover, .ac-item.selected { background: var(--bg3); }
        .ac-item-cmd { color: var(--text); }
        .ac-item-desc { color: var(--dim); font-size: 8px; }
        
        /* ============================================= */
        /* TABLET / IPAD ADAPTIVE (iPad mini 7: 744px+) */
        /* ============================================= */
        
        @media (min-width: 600px) {
            body {
                font-size: 11px;
            }
            
            .status-bar {
                font-size: 11px;
                padding: 8px 20px;
                padding-top: calc(8px + env(safe-area-inset-top));
            }
            
            .hud {
                font-size: 11px;
                padding: 8px 20px;
                top: calc(38px + env(safe-area-inset-top));
            }
            
            .hud-intent {
                display: block; /* Show intent on tablets */
            }
            
            .terminal {
                padding: 15px 20px;
                padding-top: calc(50px + env(safe-area-inset-top));
                padding-bottom: calc(130px + env(safe-area-inset-bottom));
                max-width: 900px;
                margin: 0 auto;
            }
            .terminal.with-hud {
                padding-top: calc(85px + env(safe-area-inset-top));
            }
            
            .console-output {
                font-size: 11px;
            }
            
            .quick-actions {
                bottom: calc(60px + env(safe-area-inset-bottom));
                padding: 10px 20px;
                gap: 8px;
            }
            
            .quick-btn {
                padding: 8px 16px;
                font-size: 10px;
            }
            
            .cmd-bar {
                padding: 15px 20px;
                padding-bottom: calc(15px + env(safe-area-inset-bottom));
            }
            
            .cmd-prompt {
                font-size: 14px;
                padding: 12px 8px 12px 0;
            }
            
            .cmd-input {
                font-size: 12px;
                padding: 8px 0;
            }
            
            .autocomplete {
                bottom: calc(100px + env(safe-area-inset-bottom));
                left: 20px;
                right: 20px;
                max-width: 860px;
                margin: 0 auto;
            }
            
            .ac-item {
                padding: 10px 15px;
                font-size: 11px;
            }
            
            .ac-item-desc {
                font-size: 10px;
            }
        }
        
        /* iPad Landscape / Large tablets (1000px+) */
        @media (min-width: 1000px) {
            body {
                font-size: 12px;
            }
            
            .status-bar {
                font-size: 12px;
                padding: 10px 30px;
            }
            
            .hud {
                font-size: 12px;
                padding: 10px 30px;
                gap: 30px;
            }
            
            .terminal {
                padding: 20px 30px;
                max-width: 1000px;
            }
            
            .console-output {
                font-size: 12px;
                line-height: 1.5;
            }
            
            .line {
                margin-bottom: 2px;
            }
            
            .quick-actions {
                max-width: 1000px;
                margin: 0 auto;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 30px;
            }
            
            .quick-btn {
                padding: 10px 20px;
                font-size: 11px;
            }
            
            .cmd-bar {
                max-width: 1000px;
                left: 50%;
                transform: translateX(-50%);
                padding: 15px 30px;
                border-radius: 8px 8px 0 0;
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
            }
            
            .cmd-input {
                font-size: 13px;
            }
            
            .autocomplete {
                max-width: 940px;
                left: 50%;
                transform: translateX(-50%);
            }
        }
        
        /* Landscape orientation optimizations */
        @media (orientation: landscape) and (min-width: 600px) {
            .hud {
                gap: 25px;
            }
            
            .hud-item {
                white-space: nowrap;
            }
            
            .terminal {
                padding-bottom: calc(110px + env(safe-area-inset-bottom));
            }
            
            .quick-actions {
                bottom: calc(50px + env(safe-area-inset-bottom));
            }
        }
        
        /* Touch-friendly tap targets for tablets */
        @media (pointer: coarse) and (min-width: 600px) {
            .quick-btn {
                min-height: 44px;
                min-width: 60px;
            }
            
            .cmd-prompt {
                min-width: 44px;
                min-height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .ac-item {
                min-height: 44px;
                display: flex;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <span class="status-left" id="statusLeft">OSC</span>
        <span class="status-right" id="statusRight">IDLE</span>
    </div>
    
    <div class="hud" id="hud">
        <div class="hud-item" id="hudSession">SESSION: <span>—</span></div>
        <div class="hud-item hud-intent" id="hudIntent">INTENT: <span>—</span></div>
        <div class="hud-item" id="hudTask">TASK: <span>—</span></div>
        <div class="hud-item" id="hudLoad">LOAD: <span>—</span></div>
        <div class="hud-item" id="hudStreak">STREAK: <span>—</span></div>
    </div>
    
    <div class="terminal" id="terminal">
        <div class="console-output" id="output"></div>
    </div>
    
    <div class="quick-actions" id="quickActions"></div>
    
    <div class="autocomplete" id="autocomplete"></div>
    
    <div class="cmd-bar">
        <span class="cmd-prompt">&gt;</span>
        <input type="text" class="cmd-input" id="input" placeholder="" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>

<script>
// ===========================================================================
// OSC — OPERATOR SESSION CONSOLE
// ===========================================================================

const APP_VERSION = '5.3';

const $ = id => document.getElementById(id);
const S = {
    get: k => { try { return JSON.parse(localStorage.getItem('osc_' + k)); } catch { return null; } },
    set: (k, v) => localStorage.setItem('osc_' + k, JSON.stringify(v)),
    events: () => S.get('events') || [],
    append: e => { const ev = S.events(); ev.push(e); S.set('events', ev); return e; },
    config: () => S.get('config') || { safeWindowMinutes: 90, planKeep: false, flatlineScore: 85 },
    plan: () => S.get('plan') || [],
    setPlan: p => S.set('plan', p),
    lastCmd: () => S.get('lastCmd') || '',
    setLastCmd: c => S.set('lastCmd', c),
    lastIntent: () => S.get('lastIntent') || '',
    setLastIntent: i => S.set('lastIntent', i),
    templates: () => S.get('templates') || {},
    setTemplates: t => S.set('templates', t)
};

// ===========================================================================
// COGNITIVE ENGINE
// ===========================================================================

const Cog = {
    calc(startTime, events, cfg = S.config(), endTime = null) {
        const now = endTime ? new Date(endTime).getTime() : Date.now();
        const start = new Date(startTime).getTime();
        const durMin = (now - start) / 60000;
        const safeWindow = cfg.safeWindowMinutes || 90;
        
        const taskStarts = events.filter(e => e.type === 'TASK_STARTED');
        const taskFails = events.filter(e => e.type === 'TASK_FAILED');
        const taskDone = events.filter(e => e.type === 'TASK_COMPLETED');
        const totalFinished = taskDone.length + taskFails.length;
        
        const durPen = Math.min(25, (durMin / safeWindow) * 25);
        const switchRate = durMin > 1 ? taskStarts.length / durMin : 0;
        const switchPen = Math.min(25, switchRate * 25);
        
        let idleMin = 0;
        const sorted = [...events].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
        for (let i = 1; i < sorted.length; i++) {
            const gap = (new Date(sorted[i].timestamp) - new Date(sorted[i-1].timestamp)) / 60000;
            if (gap > 5) idleMin += gap;
        }
        const idlePen = Math.min(25, (idleMin / 15) * 25);
        
        const errDensity = totalFinished > 0 ? taskFails.length / totalFinished : 0;
        const errPen = Math.min(25, errDensity * 50);
        
        const hour = new Date(now).getHours();
        const nightPen = (hour >= 22 || hour < 6) ? 15 : 0;
        
        const score = Math.round(durPen + switchPen + idlePen + errPen + nightPen);
        const level = score >= 75 ? 'CRITICAL' : score >= 50 ? 'HIGH' : score >= 25 ? 'MED' : 'LOW';
        
        return {
            level, score,
            factors: {
                duration: { value: Math.round(durMin), max: safeWindow, penalty: Math.round(durPen) },
                switchRate: { value: switchRate.toFixed(2), penalty: Math.round(switchPen) },
                idleGaps: { value: Math.round(idleMin), penalty: Math.round(idlePen) },
                errors: { value: taskFails.length, total: totalFinished, penalty: Math.round(errPen) },
                circadian: { night: nightPen > 0, penalty: nightPen }
            }
        };
    }
};

// ===========================================================================
// SESSION MANAGER (Numeric task IDs, Plan support, Streak tracking)
// ===========================================================================

const SM = {
    session: null,
    tasks: new Map(),      // taskNum -> task object
    focusTaskNum: null,    // Current focus task (numeric)
    nextTaskNum: 1,        // Session-scoped task counter
    streak: 0,             // Consecutive completed tasks
    lastStreakTime: null,  // Time of last streak update
    
    genId: p => `${Date.now()}${Math.floor(Math.random() * 10000).toString().padStart(4, '0')}`,
    
    emit(type, sid, payload = {}) {
        return S.append({ id: SM.genId('evt'), type, sessionId: sid, timestamp: new Date().toISOString(), payload });
    },
    
    // Map legacy task IDs to numeric within session events
    buildTaskNumMap(sessionEvents) {
        const map = new Map();
        let num = 1;
        sessionEvents.filter(e => e.type === 'TASK_STARTED').forEach(e => {
            // If taskNum exists use it, otherwise assign sequential
            const taskNum = e.payload.taskNum || num;
            map.set(e.payload.taskId, taskNum);
            num = Math.max(num, taskNum) + 1;
        });
        return map;
    },
    
    restore() {
        const ev = S.events();
        const starts = ev.filter(e => e.type === 'SESSION_STARTED');
        const ends = ev.filter(e => e.type === 'SESSION_ENDED');
        const endIds = new Set(ends.map(e => e.sessionId));
        const open = [...starts].reverse().find(s => !endIds.has(s.sessionId));
        
        if (open) {
            SM.session = { id: open.sessionId, intent: open.payload.intent, startedAt: open.timestamp };
            SM.tasks.clear();
            SM.focusTaskNum = null;
            SM.nextTaskNum = 1;
            
            const se = ev.filter(e => e.sessionId === SM.session.id);
            const taskNumMap = SM.buildTaskNumMap(se);
            
            // Restore all active tasks
            const taskEnds = se.filter(e => ['TASK_COMPLETED', 'TASK_FAILED', 'TASK_ABANDONED'].includes(e.type));
            const endedTaskIds = new Set(taskEnds.map(e => e.payload.taskId));
            
            se.filter(e => e.type === 'TASK_STARTED').forEach(e => {
                const taskNum = taskNumMap.get(e.payload.taskId) || SM.nextTaskNum++;
                SM.nextTaskNum = Math.max(SM.nextTaskNum, taskNum + 1);
                
                if (!endedTaskIds.has(e.payload.taskId)) {
                    const task = { 
                        num: taskNum,
                        id: e.payload.taskId, 
                        label: e.payload.label, 
                        startedAt: e.timestamp,
                        planned: e.payload.planned || false
                    };
                    SM.tasks.set(taskNum, task);
                    SM.focusTaskNum = taskNum;
                }
            });
        }
    },
    
    active: () => !!SM.session,
    hasTask: () => SM.tasks.size > 0,
    taskCount: () => SM.tasks.size,
    
    // Get focus task
    getFocusTask() {
        if (SM.focusTaskNum && SM.tasks.has(SM.focusTaskNum)) {
            return SM.tasks.get(SM.focusTaskNum);
        }
        // Fallback to highest numbered active task
        const nums = Array.from(SM.tasks.keys()).sort((a,b) => b - a);
        return nums.length > 0 ? SM.tasks.get(nums[0]) : null;
    },
    
    // Set focus task by numeric ID
    setFocus(numHint) {
        const num = parseInt(numHint);
        if (isNaN(num) || !SM.tasks.has(num)) {
            throw `ERR: Task #${numHint} not found`;
        }
        SM.focusTaskNum = num;
        const t = SM.tasks.get(num);
        return { ...t };
    },
    
    // Find task by numeric ID
    findTaskByNum(numHint) {
        if (!numHint) return null;
        const num = parseInt(String(numHint).replace(/[#\[\]]/g, ''));
        if (isNaN(num)) return null;
        return SM.tasks.get(num) || null;
    },
    
    // Get task by numeric ID or return focus task
    findTask(numHint) {
        if (!numHint) {
            return SM.getFocusTask();
        }
        return SM.findTaskByNum(numHint);
    },
    
    enter(intent, importPlan = true) {
        if (SM.session) throw 'ERR: Session active. Use "exit" first.';
        if (!intent) throw 'ERR: Intent required. Usage: enter <intent>';
        
        const sid = 's_' + Date.now();
        const e = SM.emit('SESSION_STARTED', sid, { intent });
        SM.session = { id: sid, intent, startedAt: e.timestamp };
        SM.tasks.clear();
        SM.focusTaskNum = null;
        SM.nextTaskNum = 1;
        SM.streak = 0;
        SM.lastStreakTime = Date.now();
        
        // Save intent for 'again' command
        S.setLastIntent(intent);
        
        // Import plan queue
        const planQueue = S.plan();
        let imported = 0;
        if (importPlan && planQueue.length > 0) {
            planQueue.forEach(item => {
                SM.taskInternal(item.label, true); // planned=true
                imported++;
            });
            // Clear plan unless planKeep is set
            const cfg = S.config();
            if (!cfg.planKeep) {
                S.setPlan([]);
            }
        }
        
        return { ...SM.session, importedPlan: imported };
    },
    
    exit(outcome = 'COMPLETED', summary = '') {
        if (!SM.session) throw 'ERR: No active session.';
        // Abandon all remaining tasks
        SM.tasks.forEach((t) => SM.emit('TASK_ABANDONED', SM.session.id, { taskId: t.id, taskNum: t.num }));
        SM.emit('SESSION_ENDED', SM.session.id, { outcome, summary });
        const ev = S.events().filter(e => e.sessionId === SM.session.id);
        const load = Cog.calc(SM.session.startedAt, ev);
        const stats = SM.statsFromEvents(ev);
        const dur = SM.fmtDur(SM.session.startedAt);
        const r = { ...SM.session, outcome, summary, duration: dur, stats, load, abandoned: SM.tasks.size };
        SM.session = null;
        SM.tasks.clear();
        SM.focusTaskNum = null;
        SM.nextTaskNum = 1;
        return r;
    },
    
    // Internal task creation with planned flag
    taskInternal(label, planned = false) {
        const tid = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2,4);
        const taskNum = SM.nextTaskNum++;
        SM.emit('TASK_STARTED', SM.session.id, { taskId: tid, taskNum, label, planned });
        const task = { num: taskNum, id: tid, label, startedAt: new Date().toISOString(), planned };
        SM.tasks.set(taskNum, task);
        SM.focusTaskNum = taskNum;
        return task;
    },
    
    task(label) {
        if (!SM.session) throw 'ERR: No active session. Use "enter <intent>" first.';
        if (!label) throw 'ERR: Label required. Usage: task <description>';
        const task = SM.taskInternal(label, false);
        return { ...task, total: SM.tasks.size, isFocus: true };
    },
    
    done(numHint = null) {
        if (!SM.session) throw 'ERR: No active session.';
        const t = SM.findTask(numHint);
        if (!t) throw numHint ? `ERR: Task #${numHint} not found` : 'ERR: No active tasks.';
        SM.emit('TASK_COMPLETED', SM.session.id, { taskId: t.id, taskNum: t.num });
        SM.tasks.delete(t.num);
        // Update focus
        if (SM.focusTaskNum === t.num) {
            const nums = Array.from(SM.tasks.keys()).sort((a,b) => b - a);
            SM.focusTaskNum = nums.length > 0 ? nums[0] : null;
        }
        // Streak: increment on done
        SM.streak++;
        SM.lastStreakTime = Date.now();
        return { ...t, duration: SM.fmtDur(t.startedAt), remaining: SM.tasks.size, streak: SM.streak };
    },
    
    fail(args = '') {
        if (!SM.session) throw 'ERR: No active session.';
        const parts = args.trim().split(/\s+/);
        let numHint = null, reason = args;
        
        // Check if first word is numeric
        if (parts[0] && /^\d+$/.test(parts[0])) {
            numHint = parts[0];
            parts.shift();
            reason = parts.join(' ');
        }
        
        const t = SM.findTask(numHint);
        if (!t) throw numHint ? `ERR: Task #${numHint} not found` : 'ERR: No active tasks.';
        SM.emit('TASK_FAILED', SM.session.id, { taskId: t.id, taskNum: t.num, reason });
        SM.tasks.delete(t.num);
        // Update focus
        if (SM.focusTaskNum === t.num) {
            const nums = Array.from(SM.tasks.keys()).sort((a,b) => b - a);
            SM.focusTaskNum = nums.length > 0 ? nums[0] : null;
        }
        // Streak: reset on fail
        SM.streak = 0;
        return { ...t, reason, remaining: SM.tasks.size };
    },
    
    drop(numHint = null) {
        if (!SM.session) throw 'ERR: No active session.';
        const t = SM.findTask(numHint);
        if (!t) throw numHint ? `ERR: Task #${numHint} not found` : 'ERR: No active tasks.';
        SM.emit('TASK_ABANDONED', SM.session.id, { taskId: t.id, taskNum: t.num });
        SM.tasks.delete(t.num);
        // Update focus
        if (SM.focusTaskNum === t.num) {
            const nums = Array.from(SM.tasks.keys()).sort((a,b) => b - a);
            SM.focusTaskNum = nums.length > 0 ? nums[0] : null;
        }
        // Streak: reset on drop
        SM.streak = 0;
        return { ...t, remaining: SM.tasks.size };
    },
    
    decide(input) {
        if (!SM.session) throw 'ERR: No active session.';
        // Support both :: and | as separators
        let sep = input.indexOf('::');
        if (sep === -1) sep = input.indexOf('|');
        if (sep === -1) throw 'ERR: Format: decide <choice> :: <reason>  (or use | as separator)';
        const choice = input.slice(0, sep).trim();
        const reason = input.slice(sep + (input[sep] === ':' ? 2 : 1)).trim();
        if (!choice || !reason) throw 'ERR: Both choice and reason required.';
        SM.emit('DECISION_LOGGED', SM.session.id, { decisionId: SM.genId('dec'), choice, reason });
        return { choice, reason };
    },
    
    status() {
        if (!SM.session) return null;
        const ev = S.events().filter(e => e.sessionId === SM.session.id);
        const focusTask = SM.getFocusTask();
        const startMs = new Date(SM.session.startedAt).getTime();
        const durationSec = Math.floor((Date.now() - startMs) / 1000);
        return {
            session: SM.session,
            duration: SM.fmtDur(SM.session.startedAt),
            durationSec,
            activeTasks: Array.from(SM.tasks.values()).map(t => ({ 
                ...t, 
                isFocus: t.num === SM.focusTaskNum
            })),
            focusTask: focusTask ? { ...focusTask } : null,
            taskCount: SM.tasks.size,
            stats: SM.statsFromEvents(ev),
            load: Cog.calc(SM.session.startedAt, ev),
            streak: SM.streak
        };
    },
    
    getTasks() {
        if (!SM.session) return [];
        const ev = S.events().filter(e => e.sessionId === SM.session.id);
        const taskNumMap = SM.buildTaskNumMap(ev);
        const m = new Map();
        
        ev.filter(e => e.type === 'TASK_STARTED').forEach(e => {
            const num = e.payload.taskNum || taskNumMap.get(e.payload.taskId) || 0;
            m.set(e.payload.taskId, { 
                id: e.payload.taskId, 
                num,
                label: e.payload.label, 
                startedAt: e.timestamp, 
                status: 'ACTIVE',
                planned: e.payload.planned || false
            });
        });
        ev.filter(e => e.type === 'TASK_COMPLETED').forEach(e => { 
            if (m.has(e.payload.taskId)) { 
                const t = m.get(e.payload.taskId);
                t.status = 'DONE'; t.endedAt = e.timestamp;
                t.durationMin = Math.round((new Date(e.timestamp) - new Date(t.startedAt)) / 60000);
            }
        });
        ev.filter(e => e.type === 'TASK_FAILED').forEach(e => { 
            if (m.has(e.payload.taskId)) { 
                const t = m.get(e.payload.taskId);
                t.status = 'FAIL'; t.endedAt = e.timestamp; t.reason = e.payload.reason;
                t.durationMin = Math.round((new Date(e.timestamp) - new Date(t.startedAt)) / 60000);
            }
        });
        ev.filter(e => e.type === 'TASK_ABANDONED').forEach(e => { 
            if (m.has(e.payload.taskId)) { 
                const t = m.get(e.payload.taskId);
                t.status = 'DROP'; t.endedAt = e.timestamp;
            }
        });
        return Array.from(m.values()).sort((a,b) => a.num - b.num);
    },
    
    getDecisions(sid = null) {
        const id = sid || SM.session?.id;
        if (!id) return [];
        return S.events()
            .filter(e => e.sessionId === id && e.type === 'DECISION_LOGGED')
            .map(e => ({ choice: e.payload.choice, reason: e.payload.reason, timestamp: e.timestamp }));
    },
    
    statsFromEvents: ev => {
        const tasks = ev.filter(e => e.type === 'TASK_STARTED');
        const planned = tasks.filter(e => e.payload.planned).length;
        return {
            completed: ev.filter(e => e.type === 'TASK_COMPLETED').length,
            failed: ev.filter(e => e.type === 'TASK_FAILED').length,
            abandoned: ev.filter(e => e.type === 'TASK_ABANDONED').length,
            decisions: ev.filter(e => e.type === 'DECISION_LOGGED').length,
            planned,
            adhoc: tasks.length - planned
        };
    },
    
    // Legacy alias
    stats: ev => SM.statsFromEvents(ev),
    
    fmtDur(s) {
        const m = Math.floor((Date.now() - new Date(s)) / 60000);
        return m < 60 ? `${m}m` : `${Math.floor(m/60)}h${m%60}m`;
    },
    
    getSessions() {
        const ev = S.events();
        const starts = ev.filter(e => e.type === 'SESSION_STARTED');
        const ends = ev.filter(e => e.type === 'SESSION_ENDED');
        const endMap = new Map(ends.map(e => [e.sessionId, e]));
        
        return starts.map(s => {
            const end = endMap.get(s.sessionId);
            const se = ev.filter(e => e.sessionId === s.sessionId);
            const load = Cog.calc(s.timestamp, se, S.config(), end?.timestamp || null);
            const endTime = end ? new Date(end.timestamp) : new Date();
            const durMin = Math.round((endTime - new Date(s.timestamp)) / 60000);
            const stats = SM.statsFromEvents(se);
            
            return {
                id: s.sessionId,
                intent: s.payload.intent,
                startedAt: s.timestamp,
                endedAt: end?.timestamp || null,
                outcome: end?.payload.outcome || 'ACTIVE',
                summary: end?.payload.summary || '',
                duration: durMin < 60 ? `${durMin}m` : `${Math.floor(durMin/60)}h${durMin%60}m`,
                durationMinutes: durMin,
                stats, load
            };
        }).sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
    },
    
    getSession(sid) {
        return SM.getSessions().find(s => s.id === sid || s.id.includes(sid));
    },
    
    getSessionTasks(sid) {
        const ev = S.events().filter(e => e.sessionId === sid);
        const taskNumMap = SM.buildTaskNumMap(ev);
        const m = new Map();
        
        ev.filter(e => e.type === 'TASK_STARTED').forEach(e => {
            const num = e.payload.taskNum || taskNumMap.get(e.payload.taskId) || 0;
            m.set(e.payload.taskId, { 
                id: e.payload.taskId, 
                num,
                label: e.payload.label, 
                startedAt: e.timestamp, 
                status: 'ACTIVE',
                planned: e.payload.planned || false
            });
        });
        ev.filter(e => e.type === 'TASK_COMPLETED').forEach(e => { 
            if (m.has(e.payload.taskId)) { 
                const t = m.get(e.payload.taskId);
                t.status = 'DONE'; t.endedAt = e.timestamp;
                t.durationMin = Math.round((new Date(e.timestamp) - new Date(t.startedAt)) / 60000);
            }
        });
        ev.filter(e => e.type === 'TASK_FAILED').forEach(e => { 
            if (m.has(e.payload.taskId)) { 
                const t = m.get(e.payload.taskId);
                t.status = 'FAIL'; t.endedAt = e.timestamp; t.reason = e.payload.reason;
                t.durationMin = Math.round((new Date(e.timestamp) - new Date(t.startedAt)) / 60000);
            }
        });
        ev.filter(e => e.type === 'TASK_ABANDONED').forEach(e => { 
            if (m.has(e.payload.taskId)) { 
                const t = m.get(e.payload.taskId);
                t.status = 'DROP'; t.endedAt = e.timestamp;
            }
        });
        return Array.from(m.values()).sort((a,b) => a.num - b.num);
    },
    
    // Search across sessions, tasks, decisions
    find(query) {
        if (!query || query.length < 2) return [];
        const q = query.toLowerCase();
        const results = [];
        const sessions = SM.getSessions();
        
        sessions.forEach((s, idx) => {
            // Search intent
            if (s.intent.toLowerCase().includes(q)) {
                results.push({ type: 'session', session: s, historyIdx: idx + 1, match: 'intent', text: s.intent });
            }
            // Search summary
            if (s.summary && s.summary.toLowerCase().includes(q)) {
                results.push({ type: 'session', session: s, historyIdx: idx + 1, match: 'summary', text: s.summary });
            }
            // Search tasks
            const tasks = SM.getSessionTasks(s.id);
            tasks.forEach(t => {
                if (t.label.toLowerCase().includes(q)) {
                    results.push({ type: 'task', session: s, task: t, historyIdx: idx + 1, match: 'task', text: t.label });
                }
            });
            // Search decisions
            const decisions = SM.getDecisions(s.id);
            decisions.forEach(d => {
                if (d.choice.toLowerCase().includes(q) || d.reason.toLowerCase().includes(q)) {
                    results.push({ type: 'decision', session: s, decision: d, historyIdx: idx + 1, match: 'decision', text: d.choice });
                }
            });
        });
        
        // Also search plan queue
        const plan = S.plan();
        plan.forEach((item, idx) => {
            if (item.label.toLowerCase().includes(q)) {
                results.push({ type: 'plan', planIdx: idx + 1, match: 'plan', text: item.label });
            }
        });
        
        return results.slice(0, 20); // Limit results
    }
};

const Export = {
    // CSV escape helper
    csvEscape(val) {
        if (val === null || val === undefined) return '';
        const str = String(val);
        if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
            return '"' + str.replace(/"/g, '""') + '"';
        }
        return str;
    },
    
    json() {
        const data = { 
            exportedAt: new Date().toISOString(), 
            version: APP_VERSION, 
            sessions: SM.getSessions(), 
            events: S.events() 
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(blob);
        a.download = `osc_export_${new Date().toISOString().split('T')[0]}.json`; 
        a.click();
        return `Exported ${data.events.length} events, ${data.sessions.length} sessions.`;
    },
    
    csv() {
        const sessions = SM.getSessions();
        if (sessions.length === 0) throw 'ERR: No sessions to export.';
        
        const headers = [
            'session_id', 'intent', 'started_at', 'ended_at', 
            'duration_minutes', 'outcome', 'tasks_completed', 
            'tasks_failed', 'tasks_abandoned', 'decisions', 
            'load_level', 'load_score'
        ];
        
        const rows = sessions.map(s => [
            Export.csvEscape(s.id),
            Export.csvEscape(s.intent),
            Export.csvEscape(s.startedAt),
            Export.csvEscape(s.endedAt || ''),
            Export.csvEscape(s.durationMinutes),
            Export.csvEscape(s.outcome),
            Export.csvEscape(s.stats.completed),
            Export.csvEscape(s.stats.failed),
            Export.csvEscape(s.stats.abandoned),
            Export.csvEscape(s.stats.decisions),
            Export.csvEscape(s.load.level),
            Export.csvEscape(s.load.score)
        ].join(','));
        
        const csv = [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
        const a = document.createElement('a'); 
        a.href = URL.createObjectURL(blob);
        a.download = `osc_sessions_${new Date().toISOString().split('T')[0]}.csv`; 
        a.click();
        return `Exported ${sessions.length} sessions to CSV.`;
    }
};
